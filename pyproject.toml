[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-pipeline"
version = "0.1.0"
description = "Multi-agent content generation pipeline: research -> write -> edit -> image -> publish"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pipeline", "pipeline.agents"]

[tool.setuptools.package-data]
pipeline = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
